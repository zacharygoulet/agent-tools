

details = """
A workflow for completing a piece of work from selection through follow-up.
"""
initial_state = "Select"

[[states]]
name = "Select"
summary = "Select what to work on."
details = """
Prefer work supplied by the user. Otherwise, look in the project's tracker, then its
inbox, todos, or roadmap. If nothing is available, ask the user what to work on.
Present alternatives when the choice is not obvious, and include priority, status,
and blockers when known. For trivial work, ask whether tracking is worthwhile.
Follow the tracker's claim rules, or use a marker when needed to avoid duplicate work.
"""
steps = [
    "Identify a candidate.",
    "Present the candidate and any useful context.",
    "Confirm the choice with the user.",
    "Claim the work if tracking it.",
]
next = ["Define"]

[[states]]
name = "Define"
summary = "Define what the work should accomplish and why before designing a solution."
details = """
Clarify the goal, motivation, scope, constraints, dependencies, and observable
acceptance criteria. For bugs, establish symptoms, reproduction, and expected behavior
before investigating root cause during Design. Coordinate repository order and
dependencies for multi-repository work. Ask only for information that cannot be
resolved from available context.
"""
steps = [
    "Read relevant context.",
    "Establish bug symptoms and reproduction if applicable.",
    "Coordinate repositories if applicable.",
    "Clarify the goal and acceptance criteria.",
    "Ask for unresolved information if needed.",
]
next = ["Design"]

[[states]]
name = "Design"
summary = "Inspect the code and agree on an implementation approach."
details = """
Compare viable approaches against existing patterns, constraints, risks, and
validation needs; recommend the simplest maintainable solution. Return to Define
if implementation invalidates the approach or requirements.
"""
steps = [
    "Inspect relevant code and constraints.",
    "Choose an approach and validation strategy.",
    "Consider a persisted plan if complexity warrants it.",
    "Get approval before coding.",
]
next = ["Implement", "Define"]

[[states]]
name = "Implement"
summary = "Make the agreed changes within the defined scope."
details = """
Before editing, choose whether to work in the current checkout, a feature branch,
or a separate worktree. Consider the change's size, risk, and concurrent work.
Follow project conventions and keep changes scoped to the agreed acceptance
criteria. Avoid unrelated cleanup. Fix build failures before moving on.

If the work contains multiple independant changes, you can do multiple
implement -> improve -> test passes to make the changes in small steps.
"""
steps = [
    "Select isolation approach",
    "Implement the approved approach.",
    "Ensure the build passes.",
    "Consider incremental commits if they help review.",
    "Explain the changes to the user"
]
next = ["Improve and Clean", "Define"]

[[states]]
name = "Improve and Clean"
summary = "Refine the implementation without changing its behavior."
details = """
Remove debugging remnants and dead code; improve names, structure, consistency,
and tests where needed. Avoid unrelated refactoring. Return to Design if cleanup
exposes a design problem. Fix build failures before moving on.
"""
steps = [
    "Review the change for clarity and scope.",
    "Refine the implementation if needed.",
    "Ensure the build passes.",
]
next = ["Test", "Design"]

[[states]]
name = "Test"
summary = "Validate the implementation."
details = """
Prefer repeatable lint and test checks that provide evidence for the change.
Return to Implement or Design if validation fails.
Return to Implement if full implementation was broken in multiple small
chunks.
"""
steps = [
    "Add tests if the behavior warrants them.",
    "Run relevant lints and tests.",
    "Consider manual checks if automated validation is insufficient.",
]
next = ["Finalize", "Implement", "Design"]

[[states]]
name = "Finalize"
summary = "Review the complete change and agree on delivery actions."
details = """
Get approval before committing, pushing, merging, archiving, or cleaning up.
Update or close tracked work only with approval and when supported by the tracker.
"""
steps = [
    "Review the diff, repository state, and validation evidence.",
    "Summarize changes and residual risks.",
    "Agree on delivery actions with the user.",
    "Update tracked work if approved and supported.",
]
next = ["Future Work"]

[[states]]
name = "Future Work"
summary = "Preserve deferred or newly discovered follow-up work."
details = """
Use the chosen tracker for approved follow-ups, preferring the local worklog
when available.
"""
steps = [
    "Identify meaningful deferred or discovered work.",
    "Ask whether the user has anything else to preserve.",
    "Record approved follow-ups if any.",
]
next = ["Self Improve"]

[[states]]
name = "Self Improve"
summary = "Consider whether this work revealed a concrete workflow improvement."
details = """
Do not invent improvements without evidence. When warranted, suggest a focused
change to devlopment tooling, related skills, or managed configuration. Apply shared
changes only with user approval.
"""
steps = [
    "Look for evidence of recurring friction.",
    "Suggest an improvement if warranted.",
    "Ask whether there is anything else to improve.",
    "Apply or log approved shared changes if any.",
]
