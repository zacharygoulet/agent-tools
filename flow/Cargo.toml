[package]
name = "flow"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-utils = { git = "https://github.com/zacharygoulet/rust-utils" }
clap = { version = "4", features = ["derive"] }
getset = "0.1.7"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
indoc = "2"
